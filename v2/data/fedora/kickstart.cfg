# This kickstart creates the fixed test account.
lang en_US.UTF-8
keyboard us
timezone UTC --utc
graphical
network --bootproto=dhcp --device=link --activate
services --enabled=plasmalogin
rootpw --lock
user --name=tester --password=tester --groups=wheel
firewall --enabled --service=ssh
selinux --enforcing
bootloader --location=mbr
ignoredisk --only-use=vda
clearpart --all --initlabel
autopart --type=lvm
shutdown
%packages
@kde-desktop-environment
plasma-login-manager
sudo
%end
%post
echo 'tester ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/tester
chmod 440 /etc/sudoers.d/tester
mkdir -p /etc/xdg
printf '[General]\nShouldShow=false\n' >/etc/xdg/plasma-welcomerc
%end
