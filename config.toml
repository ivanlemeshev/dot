min_version = "2026.11.1"

[vars]
user_home = "{{get_env(name='USERPROFILE', default=get_env(name='HOME', default=''))}}"
dotfiles_root = "{{config_source | dirname}}"
palette_state = "{{get_env(name='DOTFILES_PALETTE_STATE', default=vars.user_home ~ '/.local/state/dotfiles-palette')}}"
highlight_mode = "{% set path = vars.palette_state ~ '/mode' %}{% if path is file and read_file(path=path) | trim == 'min' %}min{% else %}full{% endif %}"
palette_roles = "{% set path = vars.palette_state ~ '/selection' %}{% set_global colors = '0 8 -' %}{% if path is file %}{% set name = read_file(path=path) | trim %}{% for line in read_file(path=vars.dotfiles_root ~ '/palettes/color-roles.txt') | split(pat='\n') %}{% set fields = line | split(pat=' ') %}{% if fields | length == 4 and fields[0] == name %}{% set_global colors = fields[1] ~ ' ' ~ fields[2] ~ ' ' ~ fields[3] %}{% endif %}{% endfor %}{% endif %}{{colors}}"
git_min_colors = "'color.branch.upstream=brightblack' 'color.decorate.remoteBranch=brightblack' 'color.decorate.stash=brightblack' 'color.grep.filename=white'"

[dotfiles]
"~/.config/bat" = { source = "bat" }
"~/.config/ripgrep" = { source = "ripgrep" }
"~/.config/git/colors" = { source = "git/colors" }
"~/.config/oh-my-posh/theme.omp.json" = { source = "oh-my-posh/theme.omp.json" }
"~/.gitconfig" = { source = "git/config" }

[env]
DOTFILES_HIGHLIGHT_MODE = "{{vars.highlight_mode}}"
DOTFILES_SELECTION_FG = "{{(vars.palette_roles | split(pat=' '))[0]}}"
DOTFILES_SELECTION_BG = "{{(vars.palette_roles | split(pat=' '))[1]}}"
DOTFILES_STATUS_FG = "{% set roles = vars.palette_roles | split(pat=' ') %}{% if '3' in (roles[2] | split(pat=',')) %}default{% else %}yellow{% endif %}"
BAT_THEME = "{{'custom-min' if vars.highlight_mode == 'min' else 'custom'}}"
BAT_CONFIG_DIR = "{{vars.user_home}}/.config/bat"
RIPGREP_CONFIG_PATH = "{{vars.user_home}}/.config/ripgrep/{{'config-min' if vars.highlight_mode == 'min' else 'config'}}"
GIT_CONFIG_PARAMETERS = "{% set previous = get_env(name='GIT_CONFIG_PARAMETERS', default='') | replace(from=\"'color.status.branch=brightblack' \" ~ vars.git_min_colors, to='') | replace(from=vars.git_min_colors, to='') | trim %}{% if vars.highlight_mode == 'min' %}{{(previous ~ ' ' ~ vars.git_min_colors) | trim}}{% else %}{{previous}}{% endif %}"
_.path = ["{{vars.user_home}}/.local/bin", "{{vars.user_home}}/.julia/bin"]
CLICOLOR = "1"
GH_ACCESSIBLE_COLORS = "1"
GH_COLOR_LABELS = false
LESS = "-FRX"
NO_COLOR = false

[task_config]
includes = ["{{config_source | dirname}}/{% if os() == 'windows' %}windows/tasks{% elif os() == 'macos' %}macos/tasks{% else %}linux/tasks{% endif %}"]

[tasks.palette]
description = "Select a terminal palette or highlighting mode"
run = "pwsh -NoProfile -File '{{vars.dotfiles_root}}/scripts/palette.ps1'"

[tools]
"cargo:psfmt" = "0.2.0"
go = "1.27.3"
golangci-lint = "2.15.0"
julia = "1.13.3"
node = "26.13.0"
pnpm = "12.18.0"
python = "3.15.2"
rust = { version = "1.99.1", profile = "default" }
uv = "0.13.7"
zig = "0.17.0"

[tools."github:bendlang/bend"]
version = "2.0.40"
os = ["linux/x64", "linux/arm64", "macos/x64", "macos/arm64"]
asset_pattern = 'bend-{{ version }}-{{ os(macos="darwin") }}-{{ arch() }}.tar.gz'
strip_components = 1
bin_path = "bin"
