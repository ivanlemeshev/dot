# This kickstart creates the fixed test account.
install
cdrom
lang en_US.UTF-8
keyboard us
network --bootproto=dhcp --device=link --activate
rootpw --lock
user --name=tester --password=tester --groups=wheel
firewall --enabled --service=ssh
selinux --enforcing
bootloader --location=mbr
autopart --type=lvm
reboot
%packages
@kde-desktop-environment
sudo
%end
%post
echo 'tester ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/tester
chmod 440 /etc/sudoers.d/tester
%end
