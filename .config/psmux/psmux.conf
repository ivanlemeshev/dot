# Keep a large history limit.
set -g history-limit 100000

# Enable mouse support.
set -g mouse on

# Use vi keys in copy mode.
setw -g mode-keys vi

# Start window and pane indexes at 1.
set -g base-index 1
set -w -g pane-base-index 1

# Tmux theme roles.
set -g @tmux_bar_bg           "#292624"
set -g @tmux_bar_fg           "#e8e3df"
set -g @tmux_block_bg         "#e8e3df"
set -g @tmux_block_fg         "#121110"
set -g @tmux_alert_bg         "#c8785b"
set -g @tmux_alert_fg         "#121110"
set -g @tmux_bell_bg          "#d9a15f"
set -g @tmux_bell_fg          "#121110"
set -g @tmux_border_fg        "#716b66"
set -g @tmux_border_active_fg "#e8e3df"
set -g @tmux_message_bg       "#292624"
set -g @tmux_message_fg       "#e8e3df"
set -g @tmux_mode_bg          "#292624"
set -g @tmux_mode_fg          "#e8e3df"

# Set status bar colours.
set -g status-style "bg=#{@tmux_bar_bg},fg=#{@tmux_bar_fg}"
set -g status-position top
set -g status-justify centre
set -g status-left-length 24
set -g status-right-length 28

# Set window list styles.
set -g window-status-style "bg=#{@tmux_bar_bg},fg=#{@tmux_bar_fg}"
set -g window-status-format " #I:#W#{?window_flags,#{window_flags}, } "
set -g window-status-bell-style "bg=#{@tmux_bell_bg},fg=#{@tmux_bell_fg},bold"
set -g window-status-current-style "bg=#{@tmux_block_bg},fg=#{@tmux_block_fg},bold"
set -g window-status-current-format " #I:#W#{?window_flags,#{window_flags}, } "
set -g window-status-separator ""

# Set pane styles.
set -g pane-border-style "fg=#{@tmux_border_fg}"
set -g pane-active-border-style "fg=#{@tmux_border_active_fg}"

# Set message styles.
set -g message-style "bg=#{@tmux_message_bg},fg=#{@tmux_message_fg}"
set -g message-command-style "bg=#{@tmux_message_bg},fg=#{@tmux_message_fg}"

# Set copy mode style.
set-window-option -g mode-style "bg=#{@tmux_mode_bg},fg=#{@tmux_mode_fg}"

# Set status bar content.
set -g status-left "#{?client_prefix,#[bg=#{@tmux_alert_bg},fg=#{@tmux_alert_fg},bold] #S ,#[bg=#{@tmux_block_bg},fg=#{@tmux_block_fg}] #S }"
set -g status-right " #{?client_prefix,#[bg=#{@tmux_alert_bg},fg=#{@tmux_alert_fg}] %Y-%m-%d %H:%M ,#[bg=#{@tmux_block_bg},fg=#{@tmux_block_fg}] %Y-%m-%d %H:%M }"
