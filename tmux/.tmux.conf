# Tmux plugin manager
# <prefix> I -> install plugins
# <prefix> U -> update plugins
# <prefix> u -> remove/uninstall plugins not on the plugin list
set -g @plugin 'tmux-plugins/tpm'

# Use <prefix> u to remove plugins not on the plugin list
set -g @tpm-clean 'u'

# Tmux plugins

# prefix + [   # enter copy mode
# y            # copy to system clipboard in copy mode
set -g @plugin 'tmux-plugins/tmux-yank'

# Set a large history limit
set -g history-limit 100000

# Use vi keys in copy mode
setw -g mode-keys vi

# Set mouse mode on
set -g mouse on

# Set the internal terminal
set -g default-terminal "tmux-256color"

# Enable true color support
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl colours (tmux 3.0+)
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Enable undercurl colours (tmux 3.0+) WSL in Windows Terminal)
if-shell 'test -n "$WSL_DISTRO_NAME"' {
  set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
}

# NOTE: Reset to a steady cursor after an application exits.
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g cursor-style block
set -g prompt-cursor-style block

# Makes pressing Esc pressing without delay
set -g escape-time 10

# Enable focus events for terminals that support them
set -g focus-events on

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
set -w -g pane-base-index 1

# Tmux theme roles
set -g @tmux_bar_bg           "black"
set -g @tmux_bar_fg           "brightwhite"
set -g @tmux_block_bg         "black"
set -g @tmux_block_fg         "yellow"
set -g @tmux_alert_bg         "black"
set -g @tmux_alert_fg         "cyan"
set -g @tmux_bell_bg          "black"
set -g @tmux_bell_fg          "brightred"
set -g @tmux_border_fg        "white"
set -g @tmux_border_active_fg "yellow"
set -g @tmux_message_bg       "black"
set -g @tmux_message_fg       "brightwhite"
set -g @tmux_mode_bg          "brightblue"
set -g @tmux_mode_fg          "black"

# Set colors to status bar
set -g status-style "bg=#{@tmux_bar_bg},fg=#{@tmux_bar_fg},nobold"
set -g status-position top
set -g status-justify centre
set -g status-left-length 24
set -g status-right-length 28

# Set window list styles
set -g window-status-style "bg=#{@tmux_bar_bg},fg=#{@tmux_bar_fg},nobold"
set -g window-status-format " #I:#W#{?window_flags,:#{window_flags},} "
set -g window-status-bell-style "bg=#{@tmux_bell_bg},fg=#{@tmux_bell_fg},nobold"
set -g window-status-current-style "bg=#{@tmux_block_bg},fg=#{@tmux_block_fg},nobold"
set -g window-status-current-format "#{?window_bell_flag,#{#[bg=#{@tmux_bell_bg},fg=#{@tmux_bell_fg},nobold] #I:#W:#{window_flags} },#{#[bg=#{@tmux_block_bg},fg=#{@tmux_block_fg},nobold] #I:#W:#{window_flags} }}"
set -g window-status-separator ""

# Panes styling
set -g pane-border-style "fg=#{@tmux_border_fg}"
set -g pane-active-border-style "fg=#{@tmux_border_active_fg}"

# Messages
set -g message-style "bg=#{@tmux_message_bg},fg=#{@tmux_message_fg}"
set -g message-command-style "bg=#{@tmux_message_bg},fg=#{@tmux_message_fg}"

# Copy mode
set-window-option -g mode-style "bg=#{@tmux_mode_bg},fg=#{@tmux_mode_fg}"

# Status bar left (session info)
set -g status-left "#{?client_prefix,#{#[bg=#{@tmux_alert_bg},fg=#{@tmux_alert_fg},nobold] #S },#{#[bg=#{@tmux_bar_bg},fg=#{@tmux_bar_fg}] #S }}"

# Status bar right (time and date)
set -g status-right " #{?client_prefix,#{#[bg=#{@tmux_alert_bg},fg=#{@tmux_alert_fg}] %Y-%m-%d %H:%M },#{#[bg=#{@tmux_bar_bg},fg=#{@tmux_bar_fg}] %Y-%m-%d %H:%M }}"

# Initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
