[bootstrap.packages]
"apt:ansible" = "latest"
"apt:bat" = "latest"
"apt:bubblewrap" = "latest"
"apt:build-essential" = "latest"
"apt:clang" = "latest"
"apt:clang-format" = "latest"
"apt:clang-tidy" = "latest"
"apt:clangd" = "latest"
"apt:cmake" = "latest"
"apt:curl" = "latest"
"apt:direnv" = "latest"
"apt:fd-find" = "latest"
"apt:ffmpeg" = "latest"
"apt:fish" = "latest"
"apt:fontconfig" = "latest"
"apt:gcc" = "latest"
"apt:gdb" = "latest"
"apt:gh" = "latest"
"apt:git" = "latest"
"apt:htop" = "latest"
"apt:jq" = "latest"
"apt:less" = "latest"
"apt:libjpeg-dev" = "latest"
"apt:pandoc" = "latest"
"apt:python3-pip" = "latest"
"apt:python3-venv" = "latest"
"apt:ripgrep" = "latest"
"apt:shellcheck" = "latest"
"apt:strace" = "latest"
"apt:tmux" = "latest"
"apt:tree" = "latest"
"apt:tzdata" = "latest"
"apt:unzip" = "latest"
"apt:vim" = "latest"
"apt:wget" = "latest"
"apt:xz-utils" = "latest"
"apt:zstd" = "latest"
"apt:xxd" = "latest"

[bootstrap.apt.sources]
fish = { ppa = "fish-shell/release-4" }
github-cli = { uris = "https://cli.github.com/packages", suites = "stable", components = "main", key = "https://cli.github.com/packages/githubcli-archive-keyring.gpg", fingerprint = "7F38BBB59D064DBCB3D84D725612B36462313325" }

[dotfiles]
"~/.config/fish/config.fish" = { source = "fish/config.fish" }
"~/.config/nvim" = { source = "nvim" }
"~/.vimrc" = { source = "vim/.vimrc" }
"~/.config/oh-my-posh/theme.omp.json" = { source = "oh-my-posh/theme.omp.json" }
"~/.tmux.conf" = { source = "tmux/.tmux.conf" }
"~/.gitconfig" = { source = "git/config" }
"~/.bash_profile/mise-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }
"~/.bashrc/mise-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }
"~/.bash_profile/neovim" = { line = 'case "$(uname -m)" in x86_64) export PATH="/opt/nvim-linux-x86_64/bin:$PATH" ;; aarch64) export PATH="/opt/nvim-linux-arm64/bin:$PATH" ;; esac', position = "prepend" }
"~/.bashrc/neovim" = { line = 'case "$(uname -m)" in x86_64) export PATH="/opt/nvim-linux-x86_64/bin:$PATH" ;; aarch64) export PATH="/opt/nvim-linux-arm64/bin:$PATH" ;; esac', position = "prepend" }

[bootstrap.mise_shell_activate]
bash = true

[env]
BAT_THEME = "ansi"
CLICOLOR = "1"
FZF_DEFAULT_OPTS = "--color=16 --border=sharp --preview-window=border-sharp --prompt='> ' --marker='>' --pointer='◆' --separator='─' --scrollbar='█' --layout=reverse --info=right --multi"
LESS = "-FRX"
NO_COLOR = false

[tasks.configure]
description = "Configure shell plugins and command line tools"
depends = ["configure:timezone", "configure:hostname", "configure:fish", "configure:vim", "configure:nvim", "configure:nvim-treesitter", "configure:fzf", "configure:fonts", "configure:oh-my-posh", "configure:tmux", "configure:git", "configure:gh", "configure:tools", "configure:assistants"]

[tasks."configure:vim"]
description = "Prepare Vim"
run = "mkdir -p $HOME/.vim/undodir && command -v vim"

[tasks."configure:tmux"]
description = "Install tmux plugins"
run = "mkdir -p ~/.tmux/plugins && if test -d ~/.tmux/plugins/tpm/.git; then git -C ~/.tmux/plugins/tpm pull --ff-only; else git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm; fi && ~/.tmux/plugins/tpm/bin/install_plugins"

[tasks."configure:gh"]
description = "Set GitHub CLI defaults"
run = "gh config set editor vim && gh config set pager less && gh config set git_protocol ssh --host github.com && gh config set accessible_colors enabled && gh config set color_labels disabled && command -v gh"

[tasks."configure:tools"]
description = "Install command line tools"
depends = ["configure:worktrunk", "configure:grpcurl", "configure:runic", "configure:racket", "configure:tree-sitter"]

[tasks."configure:worktrunk"]
description = "Install Worktrunk"
run = "cargo install worktrunk --locked && $HOME/.cargo/bin/wt config shell install --yes && test -x $HOME/.cargo/bin/wt"

[tasks."configure:grpcurl"]
description = "Install grpcurl"
run = "mkdir -p $HOME/.local/bin && GOBIN=$HOME/.local/bin go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest && test -x $HOME/.local/bin/grpcurl"

[tasks."configure:runic"]
description = "Install the Runic formatter"
run = "julia -e 'using Pkg; Pkg.Apps.add(\"Runic\")' && test -x $HOME/.julia/bin/runic"

[tasks."configure:racket"]
description = "Install Racket tools"
run = "raco pkg install --auto --skip-installed racket-langserver && raco pkg install --auto --skip-installed fmt racket-linter && raco pkg install --auto --skip-installed sicp && raco pkg show --all"

[tasks."configure:tree-sitter"]
description = "Install the Tree-sitter CLI"
run = 'cargo install tree-sitter-cli --version 0.26.12 --locked && test -x "$HOME/.cargo/bin/tree-sitter" && "$HOME/.cargo/bin/tree-sitter" --version'

[tasks."configure:assistants"]
description = "Install command line assistants"
depends = ["configure:codex", "configure:claude"]

[tasks."configure:codex"]
description = "Install Codex CLI"
run = "npm install --global @openai/codex && command -v codex"

[tasks."configure:claude"]
description = "Install Claude Code"
run = "curl -fsSL https://claude.ai/install.sh | bash && command -v claude"

[tasks."configure:oh-my-posh"]
description = "Install Oh My Posh"
run = "curl -fsSL https://ohmyposh.dev/install.sh | bash && command -v oh-my-posh"

[tasks.verify]
description = "Verify mise tools and linked configuration"
depends = ["verify:packages", "verify:tools", "verify:files", "verify:colors"]

[tasks."verify:packages"]
description = "Show installed Ubuntu packages"
run = "mise bootstrap packages status"

[tasks."verify:tools"]
description = "Check installed tool adapters"
run = 'mise which go && mise which node && mise which python && mise which racket && mise which yt-dlp && command -v gh && command -v fish && command -v vim && command -v nvim && command -v fzf && test -x "$HOME/.cargo/bin/tree-sitter" && "$HOME/.cargo/bin/tree-sitter" --version && command -v oh-my-posh && command -v tmux && test -x $HOME/.cargo/bin/wt && test -x $HOME/.local/bin/grpcurl && test -x $HOME/.julia/bin/runic && command -v codex && command -v claude'

[tasks."verify:files"]
description = "Check managed file links"
run = "mise dot status"

[tasks."verify:colors"]
description = "Check terminal color settings"
run = 'test "${BAT_THEME:-}" = ansi && test "${CLICOLOR:-}" = 1 && test "${LESS:-}" = -FRX && test "${NO_COLOR+x}" != x && test "${FZF_DEFAULT_OPTS#*--color=16}" != "$FZF_DEFAULT_OPTS" && test "$(git config --get color.ui)" = auto && test "$(gh config get accessible_colors)" = enabled && test "$(gh config get color_labels)" = disabled'

[tasks."configure:cleanup"]
description = "Remove unused apt packages and cached packages"
run = "sudo apt-get autoremove -y && sudo apt-get autoclean -y"

[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
julia = "1.13.1"
lua = "5.5.0"
node = "24.21.0"
pnpm = "12.11.2"
python = "3.15.0"
racket = "9.3"
rust = { version = "1.99.0", profile = "default" }
uv = "0.13.0"
zig = "0.17.0"
yt-dlp = { version = "latest", asset_pattern = "yt-dlp", bin = "yt-dlp" }

[tool_alias]
yt-dlp = "github:yt-dlp/yt-dlp"
