min_version = "2026.11.1"

[vars]
user_home = "{{get_env(name='USERPROFILE', default=get_env(name='HOME', default=''))}}"

[dotfiles]
"~/.config/bat" = { source = "bat" }
"~/.config/ripgrep" = { source = "ripgrep" }
"~/.config/git/colors" = { source = "git/colors" }
"~/.config/oh-my-posh/theme.omp.json" = { source = "oh-my-posh/theme.omp.json" }
"~/.gitconfig" = { source = "git/config" }

[env]
BAT_THEME = "custom"
BAT_CONFIG_DIR = "{{vars.user_home}}/.config/bat"
RIPGREP_CONFIG_PATH = "{{vars.user_home}}/.config/ripgrep/config"
_.path = ["{{vars.user_home}}/.local/bin", "{{vars.user_home}}/.julia/bin"]
CLICOLOR = "1"
GH_ACCESSIBLE_COLORS = "1"
GH_COLOR_LABELS = false
LESS = "-FRX"
NO_COLOR = false

[task_config]
includes = ["{{config_source | dirname}}/{% if os() == 'windows' %}windows/tasks{% elif os() == 'macos' %}macos/tasks{% else %}linux/tasks{% endif %}"]

[tools]
"cargo:psfmt" = "0.2.0"
go = "1.27.3"
golangci-lint = "2.15.0"
julia = "1.13.3"
node = "26.13.0"
pnpm = "12.18.0"
python = "3.15.2"
rust = { version = "1.99.1", profile = "default" }
uv = "0.13.7"
zig = "0.17.0"
