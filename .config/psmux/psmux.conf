# Keep a large history limit.
set -g history-limit 100000

# Enable mouse support.
set -g mouse on

# Use vi keys in copy mode.
setw -g mode-keys vi

# Start window and pane indexes at 1.
set -g base-index 1
set -w -g pane-base-index 1

# Use the terminal's 16 ANSI colors.
set -g status-style "fg=colour7,bg=colour0"
set -g status-position top
set -g status-justify centre
set -g status-left-length 24
set -g status-right-length 28

# Set window list styles.
set -g window-status-style "fg=colour7,bg=colour0"
set -g window-status-format " #I:#W#{?window_flags,#{window_flags}, } "
set -g window-status-bell-style "fg=colour0,bg=colour3,bold"
set -g window-status-current-style "fg=colour0,bg=colour6,bold"
set -g window-status-current-format " #I:#W#{?window_flags,#{window_flags}, } "
set -g window-status-separator ""

# Set pane styles.
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour6"

# Set message styles.
set -g message-style "fg=colour0,bg=colour6"
set -g message-command-style "fg=colour0,bg=colour6"

# Set copy mode style.
set-window-option -g mode-style "fg=colour0,bg=colour3"

# Set status bar content.
set -g status-left "#{?client_prefix,#[fg=colour0,bg=colour1,bold] ,#[fg=colour0,bg=colour6] }#S "
set -g status-right "#[fg=colour0,bg=colour6] %Y-%m-%d %H:%M "
