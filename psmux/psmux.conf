# Keep a large history limit.
set -g history-limit 100000

# Enable mouse support.
set -g mouse on

set -g cursor-style block
set -g cursor-blink off

# Use vi keys in copy mode.
setw -g mode-keys vi

# Start window and pane indexes at 1.
set -g base-index 1
set -w -g pane-base-index 1

# Tmux theme roles.
set -g @tmux_bar_bg           "black"
set -g @tmux_bar_fg           "brightwhite"
set -g @tmux_block_bg         "black"
set -g @tmux_block_fg         "yellow"
set -g @tmux_alert_bg         "black"
set -g @tmux_alert_fg         "cyan"
set -g @tmux_bell_bg          "black"
set -g @tmux_bell_fg          "brightred"
set -g @tmux_border_fg        "white"
set -g @tmux_border_active_fg "yellow"
set -g @tmux_message_bg       "black"
set -g @tmux_message_fg       "brightwhite"
set -g @tmux_mode_bg          "brightblue"
set -g @tmux_mode_fg          "black"

# Set status bar colours.
set -g status-style "bg=#{@tmux_bar_bg},fg=#{@tmux_bar_fg},nobold"
set -g status-position top
set -g status-justify centre
set -g status-left-length 24
set -g status-right-length 28

# Set window list styles.
set -g window-status-style "bg=#{@tmux_bar_bg},fg=#{@tmux_bar_fg},nobold"
set -g window-status-format " #I:#W#{?window_flags,#{window_flags}, } "
set -g window-status-bell-style "bg=#{@tmux_bell_bg},fg=#{@tmux_bell_fg},nobold"
set -g window-status-current-style "bg=#{@tmux_block_bg},fg=#{@tmux_block_fg},nobold"
set -g window-status-current-format " #I:#W#{?window_flags,#{window_flags}, } "
set -g window-status-separator ""

# Set pane styles.
set -g pane-border-style "fg=#{@tmux_border_fg}"
set -g pane-active-border-style "fg=#{@tmux_border_active_fg}"

# Set message styles.
set -g message-style "bg=#{@tmux_message_bg},fg=#{@tmux_message_fg}"
set -g message-command-style "bg=#{@tmux_message_bg},fg=#{@tmux_message_fg}"

# Set copy mode style.
set-window-option -g mode-style "bg=#{@tmux_mode_bg},fg=#{@tmux_mode_fg}"

# Set status bar content.
set -g status-left "#[bg=#{?client_prefix,#{@tmux_alert_bg},#{@tmux_bar_bg}},fg=#{?client_prefix,#{@tmux_alert_fg},#{@tmux_bar_fg}},nobold] #S "
set -g status-right "#[bg=#{?client_prefix,#{@tmux_alert_bg},#{@tmux_bar_bg}},fg=#{?client_prefix,#{@tmux_alert_fg},#{@tmux_bar_fg}},nobold] %Y-%m-%d %H:%M "
