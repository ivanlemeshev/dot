[tools]
go = "1.27.2"
golangci-lint = "2.12.2"
julia = "1.13.1"
# Lua is supplied by MSYS2/UCRT64 on Windows (see bin/bootstrap.ps1). Installing
# it through mise there breaks the native Windows environment.
lua = { version = "5.5.0", os = ["linux", "macos"] } # Includes luarocks
node = "24.21.0"
pnpm = "12.11.2"
python = "3.15.0"
racket = "9.3"
rust = { version = "1.99.0", profile = "default" }
uv = "0.13.0"
zig = "0.17.0"
