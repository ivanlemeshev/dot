# This kickstart creates the fixed test account.
lang en_US.UTF-8
keyboard us
timezone UTC --utc
cmdline
network --bootproto=dhcp --device=link --activate
services --enabled=plasmalogin
rootpw --lock
user --name=tester --password=tester --groups=wheel
firewall --enabled --service=ssh
selinux --enforcing
bootloader --location=mbr
ignoredisk --only-use=vda
clearpart --all --initlabel
autopart --type=lvm
shutdown
%packages
@kde-desktop-environment
plasma-login-manager
sudo
%end
%post
echo 'tester ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/tester
chmod 440 /etc/sudoers.d/tester
mkdir -p /etc/xdg
printf '[General]\nShouldShow=false\n' >/etc/xdg/plasma-welcomerc
%end
%onerror --interpreter=/bin/bash
exec >/dev/ttyS0 2>&1
for log_path in /tmp/anaconda.log /tmp/program.log /tmp/packaging.log /tmp/storage.log; do
  [ -f "$log_path" ] || continue
  printf '\nAnaconda log: %s\n' "$log_path"
  tail -n 200 "$log_path"
done
%end
