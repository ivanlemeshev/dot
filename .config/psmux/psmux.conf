# Keep a large history limit.
set -g history-limit 100000

# Enable mouse support.
set -g mouse on

# Use vi keys in copy mode.
setw -g mode-keys vi

# Start window and pane indexes at 1.
set -g base-index 1
set -w -g pane-base-index 1

# Use the terminal's ANSI colors.
set -g status-style default
set -g status-position top
set -g status-justify centre
set -g status-left-length 24
set -g status-right-length 28

# Set window list styles.
set -g window-status-style default
set -g window-status-format " #I:#W#{?window_flags,#{window_flags}, } "
set -g window-status-bell-style default
set -g window-status-current-style default
set -g window-status-current-format " #I:#W#{?window_flags,#{window_flags}, } "
set -g window-status-separator ""

# Set pane styles.
set -g pane-border-style default
set -g pane-active-border-style default

# Set message styles.
set -g message-style default
set -g message-command-style default

# Set copy mode style.
set-window-option -g mode-style default

# Set status bar content.
set -g status-left "#{?client_prefix,#[bold] ,}#S "
set -g status-right " %Y-%m-%d %H:%M "
