name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install BATS and Vim (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats vim

      - name: Install BATS and Vim (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core vim

      - name: Install Neovim
        env:
          NVIM_VERSION: v0.12.6
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) archive=nvim-linux-x86_64 ;;
            macOS-ARM64) archive=nvim-macos-arm64 ;;
            macOS-X64) archive=nvim-macos-x86_64 ;;
            *) echo "Unsupported runner: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/$archive.tar.gz" \
            --output "$RUNNER_TEMP/$archive.tar.gz"
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive/bin" >> "$GITHUB_PATH"

      - name: Verify BATS installation
        run: bats --version

      - name: Run tests
        run: make test

      - name: Run editor tests
        run: make editor-test
