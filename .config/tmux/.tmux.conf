# Tmux plugin manager
# <prefix> I -> install plugins
# <prefix> U -> update plugins
# <prefix> u -> remove/uninstall plugins not on the plugin list
set -g @plugin 'tmux-plugins/tpm'

# Use <prefix> u to remove plugins not on the plugin list
set -g @tpm-clean 'u'

# Tmux plugins

# prefix + [   # enter copy mode
# y            # copy to system clipboard in copy mode
set -g @plugin 'tmux-plugins/tmux-yank'

# Set a large history limit
set -g history-limit 100000

# Use vi keys in copy mode
setw -g mode-keys vi

# Set mouse mode on
set -g mouse on

# Set the internal terminal
set -g default-terminal "tmux-256color"

# Enable undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Pass cursor-style changes through to the terminal (Ss/Se are missing from
# tmux-256color), so the blinking cursor set in Ghostty keeps blinking in tmux.
# Se=\E[ q resets to the terminal default (blinking block).
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'

# Makes pressing Esc pressing without delay
set -g escape-time 10

# Enable focus events for terminals that support them
set -g focus-events on

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
set -w -g pane-base-index 1

# Use the terminal's default foreground and background colors.
set -g status-style "fg=default,bg=default"
set -g status-position top
set -g status-justify centre
set -g status-left-length 24
set -g status-right-length 28

# Set window list styles
set -g window-status-style "fg=brightblack,bg=default"
set -g window-status-format " #I:#W#{?window_flags,:#{window_flags},} "
set -g window-status-bell-style "fg=brightred,bg=default,bold"
set -g window-status-current-style "fg=brightcyan,bg=default,bold"
set -g window-status-current-format " #I:#W#{?window_flags,:#{window_flags},} "
set -g window-status-separator ""

# Panes styling
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan"

# Messages
set -g message-style "fg=default,bg=default,bold"
set -g message-command-style "fg=default,bg=default,bold"

# Copy mode
set-window-option -g mode-style "fg=default,bg=brightblack"

# Status bar left (session info)
set -g status-left "#{?client_prefix,#[fg=brightred]!#[default] ,}#S "

# Status bar right (time and date)
set -g status-right "#{?client_prefix,#[fg=brightred],#[fg=brightwhite]} %Y-%m-%d %H:%M#[default] "

# Initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
