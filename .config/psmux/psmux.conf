# Keep a large history limit.
set -g history-limit 100000

# Enable mouse support.
set -g mouse on

# Use vi keys in copy mode.
setw -g mode-keys vi

# Start window and pane indexes at 1.
set -g base-index 1
set -w -g pane-base-index 1

# Use the terminal's default foreground and background colors.
set -g status-style "fg=default,bg=default"
set -g status-position top
set -g status-justify centre
set -g status-left-length 24
set -g status-right-length 28

# Set window list styles.
set -g window-status-style "fg=brightblack,bg=default"
set -g window-status-format " #I:#W#{?window_flags,#{window_flags}, } "
set -g window-status-bell-style "fg=brightred,bg=default,bold"
set -g window-status-current-style "fg=brightcyan,bg=default,bold"
set -g window-status-current-format " #I:#W#{?window_flags,:#{window_flags}, } "
set -g window-status-separator ""

# Set pane styles.
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan"

# Set message styles.
set -g message-style "fg=default,bg=default,bold"
set -g message-command-style "fg=default,bg=default,bold"

# Set copy mode style.
set-window-option -g mode-style "fg=default,bg=brightblack"

# Set status bar content.
set -g status-left "#{?client_prefix,#[fg=brightyellow]!#[default] ,}#S "
set -g status-right "#{?client_prefix,#[fg=brightred],#[fg=brightwhite]} %Y-%m-%d %H:%M#[default] "
